# Mainline-native operating layer for the commissioned Plus4 hardware profile.
# The physical purge/chute/brush and adaptive-prime macros are in
# production.cfg so they can be reviewed independently from general controls.

[firmware_retraction]
# Match the proven QIDI-firmware direct-drive retract/re-prime speed.  The previous
# 40 mm/s retract and 50 mm/s unretract starved short, isolated extrusion paths.
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30

[gcode_macro _QIDI_AIR_SETTINGS]
# MAINLINE QIDI COMPATIBILITY: Storage for chamber air-filtration settings.
description: Storage for chamber air-filtration settings
variable_chamber_circulation_minimum: 0.20
gcode:
    { action_respond_info("This macro only stores Plus4 air-filtration settings") }

# Preserve the standard [fan] behavior for P0 and add the QIDI/Orca fan indexes.
[gcode_macro M106]
# MOD / STOCK DEVIATION: Set part (P0), auxiliary (P2), or chamber circulation (P3) fan.
rename_existing: M99106
description: Set part (P0), auxiliary (P2), or chamber circulation (P3) fan
gcode:
    {% set fan = params.P|default(0)|int %}
    {% set raw = params.S|default(255)|float %}
    {% set speed = [1.0, [0.0, raw / 255.0]|max]|min %}
    {% set print_active = printer.print_stats.state|lower in ["printing", "paused"] %}
    {% set air = printer["gcode_macro _QIDI_AIR_SETTINGS"] %}
    {% if fan == 0 %}
        M99106 S{raw}
    {% elif fan == 2 %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={speed}
    {% elif fan == 3 %}
        {% set chamber_speed = [speed, air.chamber_circulation_minimum|float]|max if print_active else speed %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={chamber_speed}
    {% else %}
        { action_respond_info("Ignoring unsupported fan index P%d" % fan) }
    {% endif %}

[gcode_macro M107]
# MOD / STOCK DEVIATION: Stop part (P0), auxiliary (P2), or chamber circulation (P3) fan.
rename_existing: M99107
description: Stop part (P0), auxiliary (P2), or chamber circulation (P3) fan
gcode:
    {% set fan = params.P|default(0)|int %}
    {% set force = params.FORCE|default(0)|int %}
    {% set print_active = printer.print_stats.state|lower in ["printing", "paused"] %}
    {% set air = printer["gcode_macro _QIDI_AIR_SETTINGS"] %}
    {% if fan == 0 %}
        M99107
    {% elif fan == 2 %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
    {% elif fan == 3 %}
        {% set chamber_speed = air.chamber_circulation_minimum|float if print_active and force == 0 else 0.0 %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={chamber_speed}
    {% else %}
        { action_respond_info("Ignoring unsupported fan index P%d" % fan) }
    {% endif %}

[gcode_macro M141]
# MAINLINE QIDI COMPATIBILITY: Set chamber temperature without waiting (off, or 45-65 C).
description: Set chamber temperature without waiting (off, or 45-65 C)
gcode:
    {% set requested = params.S|default(0)|float %}
    {% if requested < 0 or requested > 65 or (requested > 0 and requested < 45) %}
        { action_raise_error("Chamber target must be 0 (off), or 45-65 C") }
    {% endif %}
    {% set target = requested %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={target}

[gcode_macro M191]
# MAINLINE QIDI COMPATIBILITY: Set a valid chamber temperature and wait while heating.
description: Set a valid chamber temperature and wait while heating
gcode:
    {% set target = params.S|default(0)|float %}
    M141 S{target}
    {% if target > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={target - 1.0}
    {% endif %}

[gcode_macro BEEP]
# MAINLINE QIDI COMPATIBILITY: Pulse the mainboard beeper.
description: Pulse the mainboard beeper
gcode:
    {% set count = [10, [1, params.I|default(1)|int]|max]|min %}
    {% set duration = [2000, [20, params.DUR|default(100)|int]|max]|min %}
    {% for unused in range(count) %}
        SET_PIN PIN=beeper VALUE=1
        G4 P{duration}
        SET_PIN PIN=beeper VALUE=0
        G4 P{duration}
    {% endfor %}

# QIDI's touchscreen mute control is a print-speed override. Keep the same
# simple behaviour on mainline Klipper while preserving a pre-existing manual
# speed override so turning mute off does not unexpectedly force 100 percent.
[gcode_macro MUTE]
# MAINLINE QIDI COMPATIBILITY: Toggle quiet printing with a 50 percent speed cap.
description: Toggle quiet printing with a 50 percent speed cap
variable_enabled: 0
variable_restore_speed: 100.0
gcode:
    {% set state = printer["gcode_macro MUTE"] %}
    {% set requested = params.ENABLE|default(params.MODE|default("toggle"))|string|lower %}
    {% if requested in ["1", "on", "true"] %}
        {% set enable = 1 %}
    {% elif requested in ["0", "off", "false"] %}
        {% set enable = 0 %}
    {% elif requested == "toggle" %}
        {% set enable = 0 if state.enabled|int == 1 else 1 %}
    {% else %}
        { action_raise_error("MUTE ENABLE must be ON, OFF, 1, 0, or omitted to toggle") }
    {% endif %}
    {% if enable == 1 %}
        {% if state.enabled|int == 0 %}
            {% set current_speed = printer.gcode_move.speed_factor|float * 100.0 %}
            SET_GCODE_VARIABLE MACRO=MUTE VARIABLE=restore_speed VALUE={current_speed}
            # Never make an already-slower print faster when enabling mute.
            M220 S{[50.0, current_speed]|min}
        {% else %}
            M220 S50
        {% endif %}
        SET_GCODE_VARIABLE MACRO=MUTE VARIABLE=enabled VALUE=1
        { action_respond_info("Mute mode enabled: print speed capped at 50%") }
    {% elif state.enabled|int == 1 %}
        M220 S{state.restore_speed}
        SET_GCODE_VARIABLE MACRO=MUTE VARIABLE=enabled VALUE=0
        { action_respond_info("Mute mode disabled: speed restored to %.0f%%" % state.restore_speed) }
    {% else %}
        { action_respond_info("Mute mode is already disabled") }
    {% endif %}

[gcode_macro _QIDI_APPLY_MUTE_STATE]
# MAINLINE QIDI COMPATIBILITY: Apply the selected mute state at a print lifecycle boundary.
description: Apply the selected mute state at a print lifecycle boundary
gcode:
    {% set state = printer["gcode_macro MUTE"] %}
    {% if state.enabled|int == 1 %}
        # PRINT_START normally resets overrides, so a deliberately enabled mute
        # mode becomes the new job's 50 percent speed setting.
        SET_GCODE_VARIABLE MACRO=MUTE VARIABLE=restore_speed VALUE=100.0
        M220 S50
    {% else %}
        M220 S100
    {% endif %}

# Slicer M204 commands and maintenance macros alter Klipper's live toolhead
# limits until they are explicitly changed again. Restore the commissioned
# limits before homing so preparation moves never inherit a slow last-layer or
# calibration limit from the previous job.
[gcode_macro _QIDI_RESET_MOTION_LIMITS]
# MAINLINE QIDI COMPATIBILITY: Restore motion limits from the active printer configuration.
description: Restore motion limits from the active printer configuration
gcode:
    {% set configured = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={configured.max_velocity} ACCEL={configured.max_accel} MINIMUM_CRUISE_RATIO={configured.minimum_cruise_ratio|default(0.5)} SQUARE_CORNER_VELOCITY={configured.square_corner_velocity}

# The Plus4 bed can drift if both Z motors are released. Match the proven
# community behavior: disable requested motors, then leave both Z motors held.
[gcode_macro M84]
# SAFETY / STOCK DEVIATION: Disable motors while retaining both Z motors.
rename_existing: M9984
description: Disable motors while retaining both Z motors
gcode:
    M9984 {% for name in params %}{name}{params[name]} {% endfor %}
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1

# Upstream Klipper accepts both M18 and M84 for motor disable. Cover both so a
# slicer or KlipperScreen action cannot accidentally release the dual-Z bed.
[gcode_macro M18]
# SAFETY / STOCK DEVIATION: Disable motors while retaining both Z motors.
rename_existing: M9918
description: Disable motors while retaining both Z motors
gcode:
    M9918 {% for name in params %}{name}{params[name]} {% endfor %}
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1

[gcode_macro _QIDI_SAFE_PARK]
# SAFETY / STOCK DEVIATION: Lift and park within the commissioned build envelope.
description: Lift and park within the commissioned build envelope
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% if "z" in homed %}
        {% set lift = [10.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
        {% if lift > 0 %}
            G91
            # Match the QIDI-firmware example's pause lift rate (15 mm/s).
            G0 Z{lift} F900
            G90
        {% endif %}
    {% endif %}
    {% if "x" in homed and "y" in homed %}
        G90
        # Match the QIDI-firmware example's 200 mm/s pause/park transit rate.
        G0 X10 Y300 F12000
    {% endif %}

[gcode_macro PAUSE]
# SAFETY / STOCK DEVIATION: Pause, retract, lift, and park safely.
rename_existing: PAUSE_BASE
description: Pause, retract, lift, and park safely
gcode:
    {% if not printer.pause_resume.is_paused %}
        SET_DISPLAY_TEXT MSG="Print paused"
        SAVE_GCODE_STATE NAME=QIDI_PAUSE_STATE
        PAUSE_BASE
        {% if printer.extruder.can_extrude %}
            M83
            G1 E-1.0 F2400
        {% endif %}
        _QIDI_SAFE_PARK
    {% endif %}

[gcode_macro RESUME]
# SAFETY / STOCK DEVIATION: Restore the state saved by PAUSE and resume the print.
rename_existing: RESUME_BASE
description: Restore the state saved by PAUSE and resume the print
gcode:
    {% if printer.pause_resume.is_paused %}
        {% if printer.extruder.can_extrude %}
            M83
            G1 E1.0 F1800
        {% endif %}
        RESTORE_GCODE_STATE NAME=QIDI_PAUSE_STATE MOVE=1 MOVE_SPEED=100
        SET_DISPLAY_TEXT MSG="Printing"
        RESUME_BASE
    {% endif %}

[gcode_macro CANCEL_PRINT]
# SAFETY / STOCK DEVIATION: Cancel the current print and return the printer to a safe state.
rename_existing: CANCEL_PRINT_BASE
description: Cancel the current print and return the printer to a safe state
gcode:
    SET_DISPLAY_TEXT MSG="Print cancelled"
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-1.0 F2400
    {% endif %}
    _QIDI_SAFE_PARK
    TURN_OFF_HEATERS
    M107 P0
    M107 P2
    M107 P3 FORCE=1
    BED_MESH_CLEAR
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    _QIDI_APPLY_MUTE_STATE
    M221 S100
    CANCEL_PRINT_BASE

[gcode_macro PRINT_START]
# MAINLINE / STOCK DEVIATION: Run the complete Plus4 production start sequence.
description: Run the complete Plus4 production start sequence
gcode:
    {% set bed = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set hotend = params.EXTRUDER_TEMP|default(params.HOTEND|default(200))|float %}
    {% set chamber = params.CHAMBER_TEMP|default(params.CHAMBER|default(0))|float %}
    {% set mesh = params.MESH|default("adaptive")|lower %}
    {% set soak = [600.0, [0.0, params.SOAK|default(0)|float]|max]|min %}
    {% set mesh_margin = [25.0, [0.0, params.MESH_MARGIN|default(5)|float]|max]|min %}
    STOP_DRY_FILAMENT SILENT=1
    CLEAR_PAUSE
    BED_MESH_CLEAR
    _QIDI_RESET_MOTION_LIMITS
    _QIDI_APPLY_MUTE_STATE
    M221 S100
    G90
    SET_GCODE_OFFSET Z=0
    M140 S{bed}
    M104 S0
    # Start carbon filtration immediately. Subsequent slicer P3 commands may
    # raise this speed, but the M106/M107 wrappers retain a 20% print minimum.
    M106 P3 S51
    {% if chamber > 0 %}
        M141 S{chamber}
        M106 P2 S255
        M106 P0 S255
    {% else %}
        M141 S0
        M107 P2
        M107 P0
    {% endif %}
    SET_DISPLAY_TEXT MSG="Homing"
    G28

    # Purge into the factory chute, operate its ejector, wipe both cleaning
    # surfaces, then cool below Beacon's probing temperature.
    SET_DISPLAY_TEXT MSG="Cleaning nozzle"
    CLEAR_NOZZLE HOTEND={hotend} PURGE=1 PEI_WIPE=1

    {% if chamber > 0 %}
        SET_DISPLAY_TEXT MSG="Heating chamber"
        M106 P0 S255
        M106 P2 S255
        G0 Z5 F600
        G0 X152.5 Y152.5 F6000
        # Leave the heater at its requested target while waiting to get close;
        # QIDI's 45 C lower target bound makes setting chamber-5 invalid.
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={chamber - 5.0}
        M107 P2
        M107 P0
    {% endif %}

    SET_DISPLAY_TEXT MSG="Heating bed"
    M190 S{bed}
    M104 S0
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
    {% if soak > 0 %}
        { action_respond_info("Stabilising the bed for %.0f seconds" % soak) }
        G4 P{(soak * 1000)|int}
    {% endif %}
    # Establish the Contact Z model before tramming, following Beacon's current
    # Contact workflow. Use the proximity sensor for the Z-tilt measurements.
    SET_DISPLAY_TEXT MSG="Contact Z calibration"
    G28 Z METHOD=CONTACT CALIBRATE=1
    SET_DISPLAY_TEXT MSG="Tramming bed"
    Z_TILT_ADJUST PROBE_METHOD=PROXIMITY
    {% if mesh == "adaptive" %}
        SET_DISPLAY_TEXT MSG="Adaptive bed mesh"
        # Beacon scanning is the configured default and [beacon] mesh_runs
        # controls the number of scan passes.
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={mesh_margin}
    {% elif mesh == "default" %}
        SET_DISPLAY_TEXT MSG="Loading bed mesh"
        BED_MESH_PROFILE LOAD=default
    {% elif mesh != "none" %}
        { action_raise_error("MESH must be default, adaptive, or none") }
    {% endif %}

    # Z tilt and mesh scanning can alter the reference plane. Re-home with the
    # existing Contact model; nothing has extruded since CLEAR_NOZZLE.
    SET_DISPLAY_TEXT MSG="Final Contact Z home"
    G28 Z METHOD=CONTACT CALIBRATE=0

    {% if chamber == 0 %}
        M106 P3 S255
    {% else %}
        M141 S{chamber}
    {% endif %}

    SMART_PARK
    SET_DISPLAY_TEXT MSG="Heating nozzle"
    M109 S{hotend}
    # Beacon Contact established Z=0 with a cooler nozzle. Compensate for
    # expansion at print temperature so the first layer is not over-compressed.
    SET_GCODE_OFFSET Z=0.07
    M83
    VORON_PURGE
    M83
    G92 E0
    SET_PRINT_STATS_INFO CURRENT_LAYER=1
    SET_DISPLAY_TEXT MSG="Printing"

[gcode_macro PRINT_END]
# SAFETY / STOCK DEVIATION: Finish a print and leave the commissioned hardware safe.
description: Finish a print and leave the commissioned hardware safe
gcode:
    M400
    SET_DISPLAY_TEXT MSG="Print complete"
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-1.0 F2400
    {% endif %}
    _QIDI_SAFE_PARK
    TURN_OFF_HEATERS
    M107 P0
    M107 P2
    M107 P3 FORCE=1
    BED_MESH_CLEAR
    _QIDI_APPLY_MUTE_STATE
    M221 S100
    M84

[gcode_macro END_PRINT]
# MAINLINE QIDI COMPATIBILITY: Compatibility alias for PRINT_END.
description: Compatibility alias for PRINT_END
gcode:
    PRINT_END

[gcode_macro QIDI_STATUS]
# MAINLINE QIDI COMPATIBILITY: Report primary Plus4 state without actuating hardware.
description: Report primary Plus4 state without actuating hardware
gcode:
    { action_respond_info("Homed axes: %s" % (printer.toolhead.homed_axes|default("none"))) }
    { action_respond_info("Hotend: %.1f / %.1f C" % (printer.extruder.temperature, printer.extruder.target)) }
    { action_respond_info("Bed: %.1f / %.1f C" % (printer.heater_bed.temperature, printer.heater_bed.target)) }
    { action_respond_info("Chamber: %.1f / %.1f C" % (printer["heater_generic chamber"].temperature, printer["heater_generic chamber"].target)) }
    { action_respond_info("Mesh: %s" % (printer.bed_mesh.profile_name|default("none"))) }
    { action_respond_info("Mute: %s; speed override: %.0f%%" % ("on" if printer["gcode_macro MUTE"].enabled|int == 1 else "off", printer.gcode_move.speed_factor|float * 100.0)) }

# QIDI's heater fork continuously disables chamber heat above Z=270. Upstream
# Klipper has no position_z heater option, so reproduce the hardware guard with
# a lightweight periodic check instead of importing the vendor heater module.
# The same check catches direct SET_FAN_SPEED calls which bypass M106/M107 and
# restores the carbon-filter circulation floor during an active or paused job.
[delayed_gcode _QIDI_CHAMBER_Z_GUARD]
# SAFETY / STOCK DEVIATION: Enforce chamber-heater height safety and the active circulation-fan floor.
initial_duration: 2
gcode:
    {% set air = printer["gcode_macro _QIDI_AIR_SETTINGS"] %}
    {% set drying = printer["gcode_macro _QIDI_DRYING_STATE"] %}
    {% set print_active = printer.print_stats.state|lower in ["printing", "paused"] %}
    {% set circulation = printer["fan_generic chamber_circulation_fan"].speed|float %}
    {% set circulation_floor = drying.fan_speed|float if drying.active|int == 1 else (air.chamber_circulation_minimum|float if print_active else 0.0) %}
    {% if circulation < circulation_floor %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={circulation_floor}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes
          and printer.toolhead.position.z > 270
          and printer["heater_generic chamber"].target > 0 %}
        {% if drying.active|int == 1 %}
            STOP_DRY_FILAMENT SILENT=1
            SET_DISPLAY_TEXT MSG="Drying stopped: bed too low"
            RESPOND TYPE=error MSG="Filament drying stopped because the bed moved below the safe chamber-heater region"
        {% else %}
            M141 S0
            { action_respond_info("Chamber heater disabled above Z=270 (QIDI safety policy)") }
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_QIDI_CHAMBER_Z_GUARD DURATION=2
