# Mainline-native operator utilities replacing QIDI fork commands. These are
# intentionally visible in KlipperScreen; internal state and timers use the
# leading-underscore convention so they remain hidden from the macro panel.

[gcode_macro _QIDI_DRYING_STATE]
# MAINLINE QIDI COMPATIBILITY: Storage for chamber filament-drying state.
description: Storage for chamber filament-drying state
variable_active: 0
variable_hours: 0.0
variable_bed_target: 0.0
variable_chamber_target: 0.0
variable_fan_speed: 0.0
gcode:
    { action_respond_info("This macro only stores chamber-drying state") }

[gcode_macro PREPARE_FILAMENT_DRYING]
# MAINLINE QIDI COMPATIBILITY: Park the printer so a spool can be placed flat on the bed.
description: Park the printer so a spool can be placed flat on the bed
gcode:
    {% set print_state = printer.print_stats.state|lower %}
    {% set drying = printer["gcode_macro _QIDI_DRYING_STATE"] %}
    {% if print_state in ["printing", "paused"] %}
        { action_raise_error("Filament-drying preparation is unavailable while a print is active") }
    {% endif %}
    {% if drying.active|int == 1 %}
        { action_raise_error("Stop the active drying cycle before moving the bed") }
    {% endif %}
    _QIDI_RESET_MOTION_LIMITS
    M104 S0
    M140 S0
    M141 S0
    M107 P0
    M107 P2
    M107 P3 FORCE=1
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    # A flat spool fits below the parked toolhead while the bed remains well
    # above QIDI's Z=270 chamber-heater cutoff region.
    G0 Z100 F1200
    G0 X10 Y300 F18000
    M400
    SET_DISPLAY_TEXT MSG="Place spool flat on bed"
    RESPOND MSG="Drying preparation complete: place the spool flat on the bed, close the door and lid, then run DRY_FILAMENT"

[gcode_macro DRY_FILAMENT]
# MAINLINE QIDI COMPATIBILITY: Dry a spool on the bed using timed bed and chamber heat.
description: Dry a spool on the bed using timed bed and chamber heat
gcode:
    {% set hours = params.HOURS|default(params.TIME|default(6))|float %}
    {% set bed = params.BED_TEMP|default(params.BED|default(50))|float %}
    {% set chamber = params.CHAMBER_TEMP|default(params.CHAMBER|default(45))|float %}
    {% set fan_percent = params.FAN|default(50)|float %}
    {% set seconds = hours * 3600.0 %}
    {% set print_state = printer.print_stats.state|lower %}
    {% if print_state in ["printing", "paused"] %}
        { action_raise_error("DRY_FILAMENT is unavailable while a print is active") }
    {% endif %}
    {% if "z" not in printer.toolhead.homed_axes %}
        { action_raise_error("Run PREPARE_FILAMENT_DRYING before placing the spool in the chamber") }
    {% endif %}
    {% if printer.toolhead.position.z > 250 %}
        { action_raise_error("The bed is too low for chamber heating; remove the spool and run PREPARE_FILAMENT_DRYING") }
    {% endif %}
    {% if hours < 0.25 or hours > 24 %}
        { action_raise_error("Drying duration must be between 0.25 and 24 hours") }
    {% endif %}
    {% if bed < 35 or bed > 100 %}
        { action_raise_error("Drying bed temperature must be 35-100 C") }
    {% endif %}
    {% if chamber < 45 or chamber > 65 %}
        { action_raise_error("Drying chamber temperature must be 45-65 C") }
    {% endif %}
    {% if fan_percent < 20 or fan_percent > 100 %}
        { action_raise_error("Drying circulation fan must be 20-100 percent") }
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_QIDI_DRY_FILAMENT_COMPLETE DURATION=0
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=hours VALUE={hours}
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=bed_target VALUE={bed}
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=chamber_target VALUE={chamber}
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=fan_speed VALUE={fan_percent / 100.0}
    SET_IDLE_TIMEOUT TIMEOUT={(seconds + 900)|int}
    M104 S0
    M107 P0
    M107 P2
    M140 S{bed}
    M141 S{chamber}
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={fan_percent / 100.0}
    UPDATE_DELAYED_GCODE ID=_QIDI_DRY_FILAMENT_COMPLETE DURATION={seconds}
    SET_DISPLAY_TEXT MSG="Drying filament"
    RESPOND MSG="Filament drying started: bed {bed|int} C, chamber {chamber|int} C, fan {fan_percent|int}%, {hours} hours"

[gcode_macro STOP_DRY_FILAMENT]
# MAINLINE QIDI COMPATIBILITY: Stop chamber filament drying and turn off its heaters and fan.
description: Stop chamber filament drying and turn off its heaters and fan
gcode:
    {% set complete = params.COMPLETE|default(0)|int %}
    {% set silent = params.SILENT|default(0)|int %}
    UPDATE_DELAYED_GCODE ID=_QIDI_DRY_FILAMENT_COMPLETE DURATION=0
    M140 S0
    M141 S0
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=hours VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=bed_target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=chamber_target VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_QIDI_DRYING_STATE VARIABLE=fan_speed VALUE=0.0
    {% if silent == 0 %}
        {% if complete == 1 %}
            SET_DISPLAY_TEXT MSG="Filament drying complete"
            RESPOND MSG="Filament drying complete; heaters and circulation fan are off"
            BEEP I=2 DUR=250
        {% else %}
            SET_DISPLAY_TEXT MSG="Filament drying stopped"
            RESPOND MSG="Filament drying stopped; heaters and circulation fan are off"
            BEEP DUR=150
        {% endif %}
    {% endif %}

[delayed_gcode _QIDI_DRY_FILAMENT_COMPLETE]
# MAINLINE QIDI COMPATIBILITY: Stop the timed drying cycle when its delayed callback expires.
gcode:
    {% set drying = printer["gcode_macro _QIDI_DRYING_STATE"] %}
    {% if drying.active|int == 1 %}
        STOP_DRY_FILAMENT COMPLETE=1
    {% endif %}

# Compatibility with QIDI's newer screen/controller command. S=0 stops;
# omitted S or any non-zero value starts or replaces the timed drying cycle.
[gcode_macro SET_FILAMENT_DRY]
# MAINLINE QIDI COMPATIBILITY: QIDI-compatible timed chamber filament drying.
description: QIDI-compatible timed chamber filament drying
gcode:
    {% set enabled = params.S|default(1)|int %}
    {% if enabled == 0 %}
        STOP_DRY_FILAMENT
    {% else %}
        DRY_FILAMENT HOURS={params.HOURS|default(params.TIME|default(6))} BED_TEMP={params.BED_TEMP|default(params.BED|default(50))} CHAMBER_TEMP={params.CHAMBER_TEMP|default(params.CHAMBER|default(45))} FAN={params.FAN|default(50)}
    {% endif %}

[gcode_macro AUTO_BED_LEVEL]
# MAINLINE QIDI COMPATIBILITY: Clean the nozzle, tram Z, and generate a full Beacon bed mesh.
description: Clean the nozzle, tram Z, and generate a full Beacon bed mesh
gcode:
    {% set bed = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set hotend = params.HOTEND|default(250)|float %}
    {% set purge_amount = params.PURGE_AMOUNT|default(30)|float %}
    {% set save = params.SAVE|default(0)|int %}
    {% set print_state = printer.print_stats.state|lower %}
    {% set drying = printer["gcode_macro _QIDI_DRYING_STATE"] %}
    {% if print_state in ["printing", "paused"] %}
        { action_raise_error("AUTO_BED_LEVEL is unavailable while a print is active") }
    {% endif %}
    {% if drying.active|int == 1 %}
        { action_raise_error("Stop filament drying before bed levelling") }
    {% endif %}
    {% if bed < 30 or bed > 120 %}
        { action_raise_error("Bed levelling temperature must be 30-120 C") }
    {% endif %}
    {% if hotend < 180 or hotend > 350 %}
        { action_raise_error("Nozzle-cleaning temperature must be 180-350 C") }
    {% endif %}
    {% if purge_amount < 0 or purge_amount > 100 %}
        { action_raise_error("Bed-levelling purge amount must be 0-100 mm") }
    {% endif %}
    _QIDI_RESET_MOTION_LIMITS
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    M141 S0
    M107 P2
    M107 P3 FORCE=1
    M140 S{bed}
    SET_DISPLAY_TEXT MSG="Homing"
    G28
    SET_DISPLAY_TEXT MSG="Cleaning nozzle"
    CLEAR_NOZZLE HOTEND={hotend} PURGE={1 if purge_amount > 0 else 0} PURGE_AMOUNT={purge_amount} PEI_WIPE=1
    SET_DISPLAY_TEXT MSG="Heating bed"
    M190 S{bed}
    M104 S0
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
    SET_DISPLAY_TEXT MSG="Contact Z calibration"
    G28 Z METHOD=CONTACT CALIBRATE=1
    SET_DISPLAY_TEXT MSG="Tramming bed"
    Z_TILT_ADJUST PROBE_METHOD=PROXIMITY
    SET_DISPLAY_TEXT MSG="Full Beacon bed mesh"
    BED_MESH_CALIBRATE PROFILE=default ADAPTIVE=0
    SET_DISPLAY_TEXT MSG="Final Contact Z home"
    G28 Z METHOD=CONTACT CALIBRATE=0
    _QIDI_SAFE_PARK
    M140 S0
    M141 S0
    M107 P0
    M107 P2
    M107 P3 FORCE=1
    SET_DISPLAY_TEXT MSG="Bed levelling complete"
    BEEP I=2 DUR=250
    {% if save == 1 %}
        SAVE_CONFIG
    {% else %}
        RESPOND MSG="Full bed mesh is active; run SAVE_CONFIG to retain it after restart"
    {% endif %}

[gcode_macro BED_LEVELING]
# MAINLINE QIDI COMPATIBILITY: Alias for AUTO_BED_LEVEL.
description: Alias for AUTO_BED_LEVEL
gcode:
    AUTO_BED_LEVEL BED_TEMP={params.BED_TEMP|default(params.BED|default(60))} HOTEND={params.HOTEND|default(250)} PURGE_AMOUNT={params.PURGE_AMOUNT|default(30)} SAVE={params.SAVE|default(0)}

[gcode_macro G29]
# MAINLINE QIDI COMPATIBILITY: QIDI-compatible automatic full-bed levelling.
description: QIDI-compatible automatic full-bed levelling
gcode:
    AUTO_BED_LEVEL BED_TEMP={params.BED_TEMP|default(params.BED|default(60))} HOTEND={params.HOTEND|default(250)} PURGE_AMOUNT={params.PURGE_AMOUNT|default(30)} SAVE={params.SAVE|default(0)}

[gcode_macro AUTO_INPUT_SHAPER]
# MAINLINE QIDI COMPATIBILITY: Run upstream Klipper input-shaper calibration with the Beacon accelerometer.
description: Run upstream Klipper input-shaper calibration with the Beacon accelerometer
gcode:
    {% set axis = params.AXIS|default("BOTH")|upper %}
    {% set save = params.SAVE|default(0)|int %}
    {% set print_state = printer.print_stats.state|lower %}
    {% set drying = printer["gcode_macro _QIDI_DRYING_STATE"] %}
    {% if print_state in ["printing", "paused"] %}
        { action_raise_error("AUTO_INPUT_SHAPER is unavailable while a print is active") }
    {% endif %}
    {% if drying.active|int == 1 %}
        { action_raise_error("Stop filament drying before input-shaper calibration") }
    {% endif %}
    {% if axis not in ["X", "Y", "BOTH"] %}
        { action_raise_error("AXIS must be X, Y, or BOTH") }
    {% endif %}
    M104 S0
    M140 S0
    M141 S0
    M107 P0
    M107 P2
    M107 P3 FORCE=1
    _QIDI_RESET_MOTION_LIMITS
    G28
    SET_DISPLAY_TEXT MSG="Calibrating input shaper"
    {% if axis in ["X", "Y"] %}
        SHAPER_CALIBRATE AXIS={axis}
    {% else %}
        SHAPER_CALIBRATE
    {% endif %}
    _QIDI_SAFE_PARK
    SET_DISPLAY_TEXT MSG="Input shaper complete"
    BEEP I=2 DUR=250
    {% if save == 1 %}
        SAVE_CONFIG
    {% else %}
        RESPOND MSG="Input-shaper results are active; inspect the console, then run SAVE_CONFIG to retain them"
    {% endif %}

[gcode_macro M901]
# MAINLINE QIDI COMPATIBILITY: QIDI-compatible input-shaper calibration.
description: QIDI-compatible input-shaper calibration
gcode:
    AUTO_INPUT_SHAPER AXIS={params.AXIS|default("BOTH")} SAVE={params.SAVE|default(0)}
