# QIDI Plus4 X-7 V1.0 / Beacon mainline Klipper profile
# Complete the hardware commissioning steps in README.md before enabling the
# operating layer below on a newly migrated printer.
#
# Example annotation legend:
# - STOCK DEVIATION: behavior intentionally differs from QIDI's unmodified
#   Plus4 configuration.
# - MAINLINE QIDI COMPATIBILITY: recreates a QIDI/Orca command on upstream
#   Klipper without relying on QIDI's fork-only modules.
# - BEACON: replaces the stock Z-probe workflow and establishes nozzle-contact
#   Z=0; PRINT_START adds hot-nozzle thermal-expansion compensation afterward.
# - MOD: depends on fitted hardware, notably the PB4-connected 5015 blower.
# - QIDI HARDWARE ON MAINLINE: drives factory mechanisms such as the cutter,
#   purge chute, wipers, auxiliary fan and chamber heater from upstream Klipper.
# - SAFETY: preserves Plus4-specific safeguards that stock upstream Klipper
#   does not know about, including dual-Z holding and chamber-heater limits.

[include hardware.cfg]
[include beacon.cfg]
[include production.cfg]
[include filament.cfg]
[include utility.cfg]
[include operations.cfg]
[include maintenance.cfg]
[include klippee-macros.cfg]

# Optional after installing Klippain Shake&Tune on the host:
[include shaketune.cfg]

# Keep calibratable control defaults in the primary file. Klipper's
# SAVE_CONFIG cannot replace options originating from an included file.
[extruder]
control: pid
pid_Kp: 33.555
pid_Ki: 4.760
pid_Kd: 59.141

[heater_bed]
control: pid
pid_Kp: 63.418
pid_Ki: 1.342
pid_Kd: 749.125

[heater_generic chamber]
control: pid
pid_Kp: 63.418
pid_Ki: 1.342
pid_Kd: 749.125

# [CALIBRATION] Measured on a commissioned non-Box Plus4 on 2026-07-15 with
# Klippain Shake&Tune 6.0.0 and the Beacon Rev H accelerometer. Keep this
# calibratable section in the primary file so SAVE_CONFIG can replace it.
[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 76.4
damping_ratio_x: 0.110
shaper_type_y: ei
shaper_freq_y: 47.4
damping_ratio_y: 0.060

# Low-vibration Y alternative from the same measurement:
# shaper_type_y: mzv
# shaper_freq_y: 36.0

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[print_stats]

[exclude_object]

[respond]
default_type: echo

[gcode_arcs]
resolution: 0.5

[idle_timeout]
timeout: 1800
gcode:
    TURN_OFF_HEATERS
    M107 P0
    M107 P2
    M107 P3 FORCE=1
    M84
