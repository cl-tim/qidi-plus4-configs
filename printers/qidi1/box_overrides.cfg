# Homing-guarded wrappers for Box slot load/unload.
#
# Why this exists:
#   The stock T0-T3 and UNLOAD_T0-T3 macros in box1.cfg call EXTRUDER_LOAD /
#   EXTRUDER_UNLOAD, which internally move the toolhead to the purge chute
#   (around X=75). When triggered from Fluidd without homing first, that move
#   errors out with "Must home axis first". The Xindi touchscreen UI homes
#   before T-changes automatically, which is why this only bites from Fluidd.
#
# Why wrappers instead of rename_existing:
#   rename_existing fails on T0..T3 in this firmware ("Existing command 'T0'
#   not found") because QIDI's Klipper fork registers those names through the
#   tool-change path rather than the gcode_macro registry. So instead of
#   overriding T0 etc., these are separate commands: LOAD_T0 through LOAD_T3
#   and ULOAD_T0 through ULOAD_T3. Use these from Fluidd.
#
# Usage from Fluidd:
#   LOAD_T2      (instead of T2)
#   ULOAD_T0     (instead of UNLOAD_T0)
#
# How to include (already done in your printer.cfg):
#   [include box_overrides.cfg]

# QIDI BOX / STABILITY: Correct vendor Box outputs that otherwise calculate a
# command time from the primary MCU before queueing the command on mcu_box1.
[box_output_clock_guard]

# QIDI BOX / STABILITY: A filament insertion makes the vendor callback invoke
# RELOAD_ALL RFID=1 and immediately overlap RFID work, sensor transitions, and
# a long Box homing move. Keep that automatic path quarantined by default while
# retaining explicit LOAD_Tn/ULOAD_Tn operations below.
[gcode_macro RELOAD_ALL]
rename_existing: _QIDI_RELOAD_ALL
description: Guard automatic QIDI Box insertion after a Box MCU watchdog reset
gcode:
    {% set automatic = params.RFID|default(0)|int == 1 %}
    {% set enabled = printer.save_variables.variables.qidi_box_auto_insert|default(0)|int == 1 %}
    {% if automatic and not enabled %}
        M118 QIDI Box automatic insertion is disabled after a Box MCU watchdog reset. Use LOAD_Tn or enable it explicitly.
    {% else %}
        _QIDI_RELOAD_ALL {rawparams}
    {% endif %}

[gcode_macro QIDI_BOX_AUTO_INSERT_ENABLE]
description: Explicitly re-enable the vendor automatic Box insertion path
gcode:
    SAVE_VARIABLE VARIABLE=qidi_box_auto_insert VALUE=1
    M118 QIDI Box automatic insertion enabled

[gcode_macro QIDI_BOX_AUTO_INSERT_DISABLE]
description: Disable the vendor automatic Box insertion path
gcode:
    SAVE_VARIABLE VARIABLE=qidi_box_auto_insert VALUE=0
    M118 QIDI Box automatic insertion disabled

[gcode_macro LOAD_T0]
# QIDI BOX / STOCK DEVIATION: Home if needed, then load filament from slot 0.
description: Home if needed, then load filament from slot 0
gcode:
    _CG28
    T0

[gcode_macro LOAD_T1]
# QIDI BOX / STOCK DEVIATION: Home if needed, then load filament from slot 1.
description: Home if needed, then load filament from slot 1
gcode:
    _CG28
    T1

[gcode_macro LOAD_T2]
# QIDI BOX / STOCK DEVIATION: Home if needed, then load filament from slot 2.
description: Home if needed, then load filament from slot 2
gcode:
    _CG28
    T2

[gcode_macro LOAD_T3]
# QIDI BOX / STOCK DEVIATION: Home if needed, then load filament from slot 3.
description: Home if needed, then load filament from slot 3
gcode:
    _CG28
    T3

[gcode_macro ULOAD_T0]
# QIDI BOX / STOCK DEVIATION: Home if needed, then unload filament from slot 0.
description: Home if needed, then unload filament from slot 0
gcode:
    _CG28
    UNLOAD_T0

[gcode_macro ULOAD_T1]
# QIDI BOX / STOCK DEVIATION: Home if needed, then unload filament from slot 1.
description: Home if needed, then unload filament from slot 1
gcode:
    _CG28
    UNLOAD_T1

[gcode_macro ULOAD_T2]
# QIDI BOX / STOCK DEVIATION: Home if needed, then unload filament from slot 2.
description: Home if needed, then unload filament from slot 2
gcode:
    _CG28
    UNLOAD_T2

[gcode_macro ULOAD_T3]
# QIDI BOX / STOCK DEVIATION: Home if needed, then unload filament from slot 3.
description: Home if needed, then unload filament from slot 3
gcode:
    _CG28
    UNLOAD_T3
