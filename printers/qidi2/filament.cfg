# Standalone Plus4 filament handling for a printer without a QIDI Box. The
# cutter is operated mechanically by moving the toolhead against its front-
# right actuator. LOAD_FILAMENT and UNLOAD_FILAMENT are the names used by
# KlipperScreen's Extrude panel; M603/M604 retain QIDI compatibility.

[gcode_macro _QIDI_FILAMENT_SETTINGS]
# QIDI HARDWARE ON MAINLINE: Storage for standalone cutter and filament handling.
description: Storage for standalone cutter and filament handling
variable_default_temperature: 250.0
variable_cool_target: 140.0
variable_load_amount: 120.0
variable_unload_flush_amount: 50.0
variable_cutter_x: 305.0
variable_cutter_staging_y: 35.0
variable_cutter_approach_y: 20.0
variable_cutter_press_y: 5.0
variable_cutter_clearance_z: 5.0
gcode:
    { action_respond_info("This macro only stores Plus4 filament settings") }

[gcode_macro CUT_FILAMENT]
# QIDI HARDWARE ON MAINLINE: Cut filament with the Plus4 toolhead cutter.
description: Cut filament with the Plus4 toolhead cutter
gcode:
    {% set state = printer.print_stats.state|lower %}
    {% if state == "printing" %}
        { action_raise_error("CUT_FILAMENT is only available while idle or paused") }
    {% endif %}
    {% set settings = printer["gcode_macro _QIDI_FILAMENT_SETTINGS"] %}
    {% set original_accel = printer.toolhead.max_accel|float %}
    {% set original_cruise = printer.toolhead.minimum_cruise_ratio|float %}
    {% set position = printer.toolhead.position %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set lift_target = [axis_maximum.z, position.z + settings.cutter_clearance_z]|min %}
    SAVE_GCODE_STATE NAME=QIDI_CUT_FILAMENT_STATE
    SET_VELOCITY_LIMIT ACCEL=10000 MINIMUM_CRUISE_RATIO=0.5
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
        G90
        G1 Z10 F1800
    {% else %}
        G90
        G1 Z{lift_target} F1800
    {% endif %}
    # Move forward before traversing to the far-right side. This keeps an
    # umbilical toolhead cable away from the lid at the rear of the printer.
    # Retain QIDI's proven 50 mm/s speed for the actual cutter press.
    G1 Y{settings.cutter_staging_y} F18000
    G1 X{settings.cutter_x} F18000
    G1 Y{settings.cutter_approach_y} F18000
    G1 Y{settings.cutter_press_y} F3000
    G4 P500
    G1 Y{settings.cutter_approach_y} F9000
    G1 Y{settings.cutter_press_y} F3000
    G4 P500
    G1 Y{settings.cutter_approach_y} F9000
    M400
    SET_VELOCITY_LIMIT ACCEL={original_accel} MINIMUM_CRUISE_RATIO={original_cruise}
    RESTORE_GCODE_STATE NAME=QIDI_CUT_FILAMENT_STATE
    RESPOND MSG="Filament cut complete - downstream filament remains in the hotend"

[gcode_macro LOAD_FILAMENT]
# QIDI HARDWARE ON MAINLINE: Heat and load filament into the nozzle using the factory chute.
description: Heat and load filament into the nozzle using the factory chute
gcode:
    {% set settings = printer["gcode_macro _QIDI_FILAMENT_SETTINGS"] %}
    {% set requested_temperature = params.TEMP|default(params.S|default(0))|float %}
    {% set current_target = printer.extruder.target|float %}
    {% set temperature = requested_temperature if requested_temperature > 0 else (current_target if current_target >= 175 else settings.default_temperature) %}
    {% set speed = params.SPEED|default(300)|float %}
    {% set amount = params.AMOUNT|default(settings.load_amount)|float %}
    {% set state = printer.print_stats.state|lower %}
    {% set original_target = printer.extruder.target|float %}
    {% set original_fan = (printer.fan.speed * 255.0)|int %}
    {% set sensor_enabled = printer["filament_switch_sensor filament"].enabled %}
    {% if state == "printing" %}
        { action_raise_error("LOAD_FILAMENT is only available while idle or paused") }
    {% endif %}
    SAVE_GCODE_STATE NAME=QIDI_LOAD_FILAMENT_STATE
    SET_FILAMENT_SENSOR SENSOR=filament ENABLE=0
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    PURGE_PARK
    M109 S{temperature}
    _QIDI_PURGE_INTO_CHUTE AMOUNT={amount} SPEED={speed}
    M104 S{settings.cool_target}
    M106 P0 S255
    G4 P3000
    _QIDI_EJECT_PURGE
    M106 P0 S{original_fan}
    M104 S{original_target}
    SET_FILAMENT_SENSOR SENSOR=filament ENABLE={1 if sensor_enabled else 0}
    M400
    RESTORE_GCODE_STATE NAME=QIDI_LOAD_FILAMENT_STATE
    BEEP DUR=150
    RESPOND MSG="Filament load complete"

[gcode_macro UNLOAD_FILAMENT]
# QIDI HARDWARE ON MAINLINE: Cut filament and flush the remaining filament into the chute.
description: Cut filament and flush the remaining filament into the chute
gcode:
    {% set settings = printer["gcode_macro _QIDI_FILAMENT_SETTINGS"] %}
    {% set requested_temperature = params.TEMP|default(params.S|default(0))|float %}
    {% set current_target = printer.extruder.target|float %}
    {% set temperature = requested_temperature if requested_temperature > 0 else (current_target if current_target >= 175 else settings.default_temperature) %}
    {% set speed = params.SPEED|default(300)|float %}
    {% set amount = params.AMOUNT|default(settings.unload_flush_amount)|float %}
    {% set state = printer.print_stats.state|lower %}
    {% set original_target = printer.extruder.target|float %}
    {% set original_fan = (printer.fan.speed * 255.0)|int %}
    {% set sensor_enabled = printer["filament_switch_sensor filament"].enabled %}
    {% if state == "printing" %}
        { action_raise_error("UNLOAD_FILAMENT is only available while idle or paused") }
    {% endif %}
    SAVE_GCODE_STATE NAME=QIDI_UNLOAD_FILAMENT_STATE
    SET_FILAMENT_SENSOR SENSOR=filament ENABLE=0
    CUT_FILAMENT
    PURGE_PARK
    M109 S{temperature}
    _QIDI_PURGE_INTO_CHUTE AMOUNT={amount} SPEED={speed}
    M104 S{settings.cool_target}
    M106 P0 S255
    G4 P3000
    _QIDI_EJECT_PURGE
    M106 P0 S{original_fan}
    M104 S{original_target}
    SET_FILAMENT_SENSOR SENSOR=filament ENABLE={1 if sensor_enabled else 0}
    M400
    RESTORE_GCODE_STATE NAME=QIDI_UNLOAD_FILAMENT_STATE
    BEEP DUR=150
    RESPOND MSG="Filament unload complete - remove it from the toolhead inlet"

[gcode_macro M603]
# QIDI HARDWARE ON MAINLINE: QIDI-compatible standalone filament unload.
description: QIDI-compatible standalone filament unload
gcode:
    UNLOAD_FILAMENT TEMP={params.S|default(250)} SPEED={params.SPEED|default(300)}

[gcode_macro M604]
# QIDI HARDWARE ON MAINLINE: QIDI-compatible standalone filament load.
description: QIDI-compatible standalone filament load
gcode:
    LOAD_FILAMENT TEMP={params.S|default(250)} SPEED={params.SPEED|default(300)}

[gcode_macro M600]
# QIDI HARDWARE ON MAINLINE: Pause and cut/unload filament for a manual filament change.
description: Pause and cut/unload filament for a manual filament change
gcode:
    {% set current_target = printer.extruder.target|float %}
    {% set temperature = params.S|default(current_target if current_target >= 175 else 250)|float %}
    PAUSE
    UNLOAD_FILAMENT TEMP={temperature} SPEED={params.SPEED|default(300)}
