# The renderer replaces this token with the target printer's exact by-id path.

[beacon]
serial: CHANGE_ME_BEACON_SERIAL
x_offset: 14.0
y_offset: -11.0
# Measured on the right-side Rev H mount with Shake&Tune AXES_MAP_CALIBRATION.
accel_axes_map: -y, x, z
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 180
home_xy_position: 152.5,152.5
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
# SAFETY / STOCK DEVIATION: At the rear chute, moving X first can cross the
# nozzle-cleaning hardware. Beacon therefore homes Y toward the front first.
home_y_before_x: true
home_method: proximity
home_method_when_homed: proximity
home_autocalibrate: never
home_gcode_pre_x: _BEACON_HOME_PRE_X
home_gcode_post_x: _BEACON_HOME_POST_X
home_gcode_pre_y: _BEACON_HOME_PRE_Y
home_gcode_post_y: _BEACON_HOME_POST_Y
contact_activate_gcode: _BEACON_CONTACT_PRE_Z
contact_deactivate_gcode: _BEACON_CONTACT_POST_Z
contact_sensitivity: 1
contact_latency_min: 2
autocal_tolerance: 0.012

# Beacon Rev H registers its accelerometer automatically.
[resonance_tester]
accel_chip: beacon
accel_per_hz: 150
max_smoothing: 0.1
probe_points:
    152.5,152.5,15

[gcode_macro _BEACON_HOME_PRE_X]
# BEACON / STOCK DEVIATION: Reduce X motor current before Beacon sensorless X homing.
gcode:
    {% set run_current = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_current * 0.6}

[gcode_macro _BEACON_HOME_POST_X]
# BEACON / STOCK DEVIATION: Move off the X endstop and restore the configured X motor current.
gcode:
    {% set run_current = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    # Match QIDI1's post-home move-away rate (150 mm/s).
    G1 X20 F9000
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_current}

[gcode_macro _BEACON_HOME_PRE_Y]
# BEACON / STOCK DEVIATION: Reduce Y motor current before Beacon sensorless Y homing.
gcode:
    {% set run_current = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_current * 0.8}

[gcode_macro _BEACON_HOME_POST_Y]
# BEACON / STOCK DEVIATION: Move off the Y endstop and restore the configured Y motor current.
gcode:
    {% set run_current = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    # Match QIDI1's post-home move-away rate (150 mm/s).
    G1 Y20 F9000
    M400
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_current}

[gcode_macro _BEACON_CONTACT_PRE_Z]
# BEACON / STOCK DEVIATION: Finish queued motion before Beacon Contact Z probing begins.
gcode:
    M400

[gcode_macro _BEACON_CONTACT_POST_Z]
# BEACON / STOCK DEVIATION: Back the bed away from the nozzle after Beacon Contact Z probing.
gcode:
    G1 Z3 F600
    M400

