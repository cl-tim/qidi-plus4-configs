# Managed by klippee install-moonraker.
# These macros appear automatically in Mainsail and Fluidd.

[gcode_macro KLIPPEE_STATUS]
description: Show Klippee sync status
gcode:
  {action_respond_info("Klippee status requested")}
  {action_call_remote_method("klippee_status")}

[gcode_macro KLIPPEE_PUSH]
description: Push the current config to Klippee
gcode:
  {action_respond_info("Klippee push requested")}
  {action_call_remote_method("klippee_push")}

[gcode_macro KLIPPEE_PULL]
description: Pull the latest config from Klippee
gcode:
  {action_respond_info("Klippee pull requested; Klipper will not restart automatically")}
  {action_call_remote_method("klippee_pull")}

[gcode_macro KLIPPEE_UPLOAD_DIAGNOSTICS]
description: Upload a private diagnostic bundle to Klippee
gcode:
  {action_respond_info("Klippee diagnostic upload requested")}
  {action_call_remote_method("klippee_upload_diagnostics")}
