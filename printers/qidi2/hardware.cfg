# Pin map verified against a live X-7 V1.0 Plus4 migrated to upstream Klipper.
# The primary MCU is the STM32F103 toolhead; U_1 is the STM32F401 mainboard.

[mcu]
serial: /dev/ttyS2
restart_method: command
baud: 500000

[mcu U_1]
serial: /dev/ttyS0
restart_method: command
baud: 500000

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8

[stepper_x]
step_pin: U_1:PB4
dir_pin: !U_1:PB3
enable_pin: !U_1:PB5
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: -1.5
position_endstop: -1.5
position_max: 307
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_x]
cs_pin: U_1:PD2
spi_software_sclk_pin: U_1:PA5
spi_software_mosi_pin: U_1:PA7
spi_software_miso_pin: U_1:PA6
spi_speed: 200000
run_current: 1.07
interpolate: true
stealthchop_threshold: 0
diag0_pin: !U_1:PB8
driver_SGT: 1
rref: 12000

[stepper_y]
step_pin: U_1:PC14
dir_pin: !U_1:PC13
enable_pin: !U_1:PC15
microsteps: 32
rotation_distance: 38.82
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: -2
position_endstop: -2
position_max: 325
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false
step_pulse_duration: 0.0000001

[tmc2240 stepper_y]
cs_pin: U_1:PB9
spi_software_sclk_pin: U_1:PA5
spi_software_mosi_pin: U_1:PA7
spi_software_miso_pin: U_1:PA6
spi_speed: 200000
run_current: 1.07
interpolate: true
stealthchop_threshold: 0
diag0_pin: !U_1:PC0
driver_SGT: 1
rref: 12000

[stepper_z]
step_pin: U_1:PB1
dir_pin: U_1:PB6
enable_pin: !U_1:PB0
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 285
position_min: -2
# Match the proven QIDI-firmware machine's Z homing rates.
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_z]
uart_pin: U_1:PB7
run_current: 1.07
interpolate: true
stealthchop_threshold: 9999999999
diag_pin: ^U_1:PA13
sense_resistor: 0.075

[stepper_z1]
step_pin: U_1:PC10
dir_pin: U_1:PA15
enable_pin: !U_1:PC11
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: U_1:PC5
run_current: 1.07
interpolate: true
stealthchop_threshold: 9999999999
diag_pin: ^U_1:PC12
sense_resistor: 0.075

[extruder]
step_pin: PB9
dir_pin: PB8
enable_pin: !PC15
rotation_distance: 53.7
gear_ratio: 1517:170
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PB3
sensor_type: MAX6675
sensor_pin: PB12
spi_speed: 100000
spi_software_sclk_pin: PB13
spi_software_mosi_pin: PA11
spi_software_miso_pin: PB14
# QIDI 1.8.2 and the referenced mainline profile both use the digital
# MAX6675 reading without an additional host-side smoothing window. The PID
# seed in printer.cfg was tuned with this setting.
smooth_time: 0.000001
max_power: 1.0
min_temp: 0
max_temp: 370
min_extrude_temp: 175
max_extrude_only_distance: 100
# The adaptive Voron prime deliberately extrudes thick, short lines. This is
# the same allowance used by the prior working Plus4/KAMP profile.
max_extrude_cross_section: 5
step_pulse_duration: 0.000002
pressure_advance: 0.032
pressure_advance_smooth_time: 0.03
instantaneous_corner_velocity: 10

[tmc2209 extruder]
uart_pin: PC13
interpolate: true
run_current: 0.714
stealthchop_threshold: 0
sense_resistor: 0.075

[heater_bed]
heater_pin: U_1:PB10
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: U_1:PA0
max_power: 1.0
pwm_cycle_time: 0.001
min_temp: 0
max_temp: 125

[heater_generic chamber]
heater_pin: U_1:PC8
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: U_1:PA1
max_power: 0.4
pwm_cycle_time: 0.135335
min_temp: 0
max_temp: 70

[verify_heater chamber]
max_error: 400
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 1

[verify_heater heater_bed]
max_error: 200
check_gain_time: 60
hysteresis: 10
heating_gain: 1

[temperature_sensor chamber_guard]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: U_1:PC2
min_temp: 0
max_temp: 100

[filament_switch_sensor filament]
switch_pin: U_1:PC3
pause_on_runout: true
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    RESPOND TYPE=error MSG="Filament sensor triggered"

# [CALIBRATION] Values measured on the source printer before migration. This
# sensor remains disabled until it is calibrated and commissioned per printer.
[hall_filament_width_sensor]
adc1: PA2
adc2: PA3
cal_dia1: 1.50
cal_dia2: 2.0
raw_dia1: 14197
raw_dia2: 15058
default_nominal_filament_diameter: 1.75
max_difference: 0
measurement_delay: 50
enable: false
measurement_interval: 10
logging: false
min_diameter: 0.3
use_current_dia_while_delay: false
pause_on_runout: true
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    RESET_FILAMENT_WIDTH_SENSOR
    RESPOND TYPE=error MSG="Filament width sensor reports runout"

[fan]
# [MOD: PB4 5015 nozzle-cooling fan]
# The modified toolhead uses the white two-pin PB4 port.
# The original PA8 fan and its PA9 tachometer are not present on this toolhead.
pin: PB4
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0

[fan_generic auxiliary_cooling_fan]
pin: U_1:PA8
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0

# [MOD: 120 mm chamber circulation fan]
# P3 controls the upgraded high-volume chamber circulation fan.
[fan_generic chamber_circulation_fan]
pin: U_1:PC9
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0

[heater_fan chamber_heater_fan]
pin: U_1:PA4
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: chamber
heater_temp: 70
fan_speed: 0.6
off_below: 0

[heater_fan hotend_fan]
pin: PB5
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50
fan_speed: 1.0
off_below: 0

[heater_fan hotend_fan3]
pin: PB10
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50
fan_speed: 1.0
off_below: 0

[controller_fan board_fan]
pin: U_1:PB2

# [MOD: 80 mm CPU fan]
# Temperature-based control is tuned for the upgraded low-noise CPU fan.
[temperature_fan adaptive_board_fan]
pin: U_1:PC4
max_power: 1.0
shutdown_speed: 1.0
cycle_time: 0.01
sensor_type: temperature_host
control: pid
pid_deriv_time: 5.0
pid_Kp: 5
pid_Ki: 2
pid_Kd: 5
target_temp: 45
min_speed: 0.4
max_speed: 1.0
min_temp: 0
max_temp: 90

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu
sensor_mcu: U_1
min_temp: 0
max_temp: 100

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100

[output_pin caselight]
pin: U_1:PC7
pwm: false
shutdown_value: 1
value: 1

[output_pin beeper]
pin: U_1:PA2
pwm: false
shutdown_value: 0
value: 0

[bed_screws]
screw1: 25,21
screw1_name: Front left
screw2: 285,21
screw2_name: Front right
screw3: 285,281
screw3_name: Back right
screw4: 25,281
screw4_name: Back left

# Nozzle positions which put the right-side Beacon at the physical screw
# coordinates. The old profile accidentally repeated its front-left coordinate
# for screw2.
[screws_tilt_adjust]
screw1: 11,32
screw1_name: Front left
screw2: 271,32
screw2_name: Front right
screw3: 271,292
screw3_name: Back right
screw4: 11,292
screw4_name: Back left
screw_thread: CW-M4

[bed_mesh]
speed: 150
horizontal_move_z: 2
zero_reference_position: 152.5,152.5
mesh_min: 22,22
mesh_max: 283,283
adaptive_margin: 5
probe_count: 14,14
algorithm: bicubic
bicubic_tension: 0.3
mesh_pps: 2,2
fade_start: 2
fade_end: 10
fade_target: 0
split_delta_z: 0.01
move_check_distance: 4

[z_tilt]
z_positions:
    -17.5,152.5
    335.7,152.5
points:
    36,163.5
    241,163.5
# Match QIDI1's Z-tilt traverse speed; probing itself remains Beacon-controlled.
speed: 200
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.006
