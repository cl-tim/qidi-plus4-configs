# Maintenance and compatibility helpers adapted from the community Plus4
# mainline configuration. PLATFORM_CALIBRATE deliberately synchronises the two
# Z drives against the printer's physical base stops; read README.md first.

# Hold the independently driven bed after Klipper connects. This matches the
# M84 policy in operations.cfg and prevents an already-level bed from drifting.
[delayed_gcode _QIDI_STARTUP_BED_HOLD]
# SAFETY / MAINLINE: Energise both independent Z motors after Klipper connects so the bed cannot drift.
initial_duration: 1.0
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
    BED_MESH_CLEAR

# If PLATFORM_CALIBRATE is interrupted while the Z drivers use reduced
# current, restore their configured currents automatically.
[gcode_macro _QIDI_PLATFORM_CALIBRATION_STATE]
# MAINLINE QIDI COMPATIBILITY: Store platform-calibration state for the recovery watchdog.
variable_active: 0
gcode:
    { action_respond_info("This macro stores platform-calibration state") }

[delayed_gcode _QIDI_PLATFORM_CURRENT_RECOVERY]
# SAFETY / MAINLINE: Restore normal Z-driver current if platform calibration is interrupted.
gcode:
    {% set state = printer["gcode_macro _QIDI_PLATFORM_CALIBRATION_STATE"] %}
    {% if state.active|int == 1 %}
        {% set z_current = printer.configfile.settings["tmc2209 stepper_z"].run_current|float %}
        {% set z1_current = printer.configfile.settings["tmc2209 stepper_z1"].run_current|float %}
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_current}
        SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={z1_current}
        SET_GCODE_VARIABLE MACRO=_QIDI_PLATFORM_CALIBRATION_STATE VARIABLE=active VALUE=0
        { action_respond_info("Restored normal Z-driver current after interrupted platform calibration") }
    {% endif %}

[gcode_macro PLATFORM_CALIBRATE]
# SAFETY / MAINLINE: Synchronise both Z drives against the physical printer-base stops.
description: Synchronise both Z drives against the physical printer-base stops
gcode:
    {% set confirmation = params.CONFIRM|default("")|upper %}
    {% set state = printer.print_stats.state|lower %}
    {% set z_home_current = 0.7 %}
    {% set z_current = printer.configfile.settings["tmc2209 stepper_z"].run_current|float %}
    {% set z1_current = printer.configfile.settings["tmc2209 stepper_z1"].run_current|float %}
    {% set z_max = printer.configfile.settings.stepper_z.position_max|float %}
    {% if confirmation != "YES" %}
        { action_raise_error("This intentionally drives the bed into its base stops. Inspect the base, then run PLATFORM_CALIBRATE CONFIRM=YES") }
    {% endif %}
    {% if state in ["printing", "paused"] %}
        { action_raise_error("PLATFORM_CALIBRATE is unavailable while a print is active") }
    {% endif %}
    {% if printer.extruder.target > 0
          or printer.heater_bed.target > 0
          or printer["heater_generic chamber"].target > 0 %}
        { action_raise_error("Turn off all heater targets before platform calibration") }
    {% endif %}
    SET_GCODE_OFFSET Z=0 MOVE=0
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G28 Z
    G0 Z{z_max - 10.0} F600
    SET_GCODE_VARIABLE MACRO=_QIDI_PLATFORM_CALIBRATION_STATE VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_QIDI_PLATFORM_CURRENT_RECOVERY DURATION=30
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_home_current}
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={z_home_current}
    # The slow final move intentionally stalls both bedscrews at the base.
    G0 Z{z_max} F50
    M400
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_current}
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={z1_current}
    SET_GCODE_VARIABLE MACRO=_QIDI_PLATFORM_CALIBRATION_STATE VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_QIDI_PLATFORM_CURRENT_RECOVERY DURATION=0
    # Raise the bed into normal Z-homing range and establish fresh coordinates.
    G0 Z25 F600
    G28
    { action_respond_info("Platform calibration complete; run Z_TILT_ADJUST before printing") }

# Compatibility alias for the longer name commonly used in Plus4 guides.
[gcode_macro PLATFORM_CALIBRATION]
# MAINLINE QIDI COMPATIBILITY: Alias for PLATFORM_CALIBRATE.
description: Alias for PLATFORM_CALIBRATE
gcode:
    PLATFORM_CALIBRATE CONFIRM={params.CONFIRM|default("NO")}

[gcode_macro PID_EXTRUDER]
# MAINLINE QIDI COMPATIBILITY: Tune the hotend PID; use SAVE=1 to save and restart afterward.
description: Tune the hotend PID; use SAVE=1 to save and restart afterward
gcode:
    {% set target = params.TEMPERATURE|default(220)|float %}
    {% set fan = [100.0, [0.0, params.FAN_IN_PERCENT|default(0)|float]|max]|min %}
    {% set save = params.SAVE|default(0)|int %}
    {% if printer.print_stats.state|lower in ["printing", "paused"] %}
        { action_raise_error("PID tuning is unavailable while a print is active") }
    {% endif %}
    {% if target < 180 or target > 350 %}
        { action_raise_error("Extruder PID temperature must be 180-350 C") }
    {% endif %}
    M106 P0 S{fan * 2.55}
    PID_CALIBRATE HEATER=extruder TARGET={target}
    TURN_OFF_HEATERS
    M107 P0
    {% if save == 1 %}
        SAVE_CONFIG
    {% else %}
        { action_respond_info("PID tune complete; run SAVE_CONFIG to retain it") }
    {% endif %}

[gcode_macro PID_BED]
# MAINLINE QIDI COMPATIBILITY: Tune the bed PID; use SAVE=1 to save and restart afterward.
description: Tune the bed PID; use SAVE=1 to save and restart afterward
gcode:
    {% set target = params.TEMPERATURE|default(60)|float %}
    {% set save = params.SAVE|default(0)|int %}
    {% if printer.print_stats.state|lower in ["printing", "paused"] %}
        { action_raise_error("PID tuning is unavailable while a print is active") }
    {% endif %}
    {% if target < 30 or target > 120 %}
        { action_raise_error("Bed PID temperature must be 30-120 C") }
    {% endif %}
    PID_CALIBRATE HEATER=heater_bed TARGET={target}
    TURN_OFF_HEATERS
    {% if save == 1 %}
        SAVE_CONFIG
    {% else %}
        { action_respond_info("PID tune complete; run SAVE_CONFIG to retain it") }
    {% endif %}

[gcode_macro PID_CHAMBER]
# MAINLINE QIDI COMPATIBILITY: Tune the chamber PID; use SAVE=1 to save and restart afterward.
description: Tune the chamber PID; use SAVE=1 to save and restart afterward
gcode:
    {% set target = params.TEMPERATURE|default(50)|float %}
    {% set save = params.SAVE|default(0)|int %}
    {% if printer.print_stats.state|lower in ["printing", "paused"] %}
        { action_raise_error("PID tuning is unavailable while a print is active") }
    {% endif %}
    {% if target < 45 or target > 65 %}
        { action_raise_error("Chamber PID temperature must be 45-65 C") }
    {% endif %}
    PID_CALIBRATE HEATER=chamber TARGET={target}
    TURN_OFF_HEATERS
    {% if save == 1 %}
        SAVE_CONFIG
    {% else %}
        { action_respond_info("PID tune complete; run SAVE_CONFIG to retain it") }
    {% endif %}

[gcode_macro M303]
# MAINLINE QIDI COMPATIBILITY: PID compatibility command: E0 hotend, E-1 bed, E1 chamber.
description: PID compatibility command: E0 hotend, E-1 bed, E1 chamber
gcode:
    {% set heater = params.E|default(0)|int %}
    {% set target = params.S|default(220 if heater == 0 else (60 if heater == -1 else 50))|float %}
    {% set save = params.SAVE|default(0)|int %}
    {% if heater == 0 %}
        PID_EXTRUDER TEMPERATURE={target} SAVE={save}
    {% elif heater == -1 %}
        PID_BED TEMPERATURE={target} SAVE={save}
    {% elif heater == 1 %}
        PID_CHAMBER TEMPERATURE={target} SAVE={save}
    {% else %}
        { action_raise_error("M303 supports E0 (hotend), E-1 (bed), or E1 (chamber)") }
    {% endif %}

[gcode_macro M290]
# MAINLINE QIDI COMPATIBILITY: Apply a live Z adjustment using standard babystep syntax.
description: Apply a live Z adjustment using standard babystep syntax
gcode:
    {% if params.Z is not defined %}
        { action_raise_error("M290 requires a Z adjustment") }
    {% endif %}
    {% set adjustment = params.Z|float %}
    {% if adjustment < -1 or adjustment > 1 %}
        { action_raise_error("A single M290 adjustment must be within -1 to +1 mm") }
    {% endif %}
    SET_GCODE_OFFSET Z_ADJUST={adjustment} MOVE=1 MOVE_SPEED=5

[gcode_macro M900]
# MAINLINE QIDI COMPATIBILITY: Set pressure advance K and optional smoothing time T.
description: Set pressure advance K and optional smoothing time T
gcode:
    {% if params.K is not defined and params.T is not defined %}
        { action_raise_error("M900 requires K and/or T") }
    {% endif %}
    {% if params.K is defined %}
        {% set advance = params.K|float %}
        {% if advance < 0 %}
            { action_raise_error("Pressure advance cannot be negative") }
        {% endif %}
        SET_PRESSURE_ADVANCE ADVANCE={advance}
    {% endif %}
    {% if params.T is defined %}
        {% set smooth = params.T|float %}
        {% if smooth <= 0 or smooth > 0.2 %}
            { action_raise_error("Pressure-advance smooth time must be above 0 and at most 0.2 seconds") }
        {% endif %}
        SET_PRESSURE_ADVANCE SMOOTH_TIME={smooth}
    {% endif %}

[gcode_macro M0]
# MAINLINE QIDI COMPATIBILITY: Pause the current print.
description: Pause the current print
gcode:
    PAUSE
