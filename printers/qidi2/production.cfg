# QIDI Plus4 production preparation for the factory chute, purge arm, rear PEI
# wiping area and silicone brush. Coordinates are carried over from the
# printer's proven 1.7.3 profile and the referenced mainline Plus4 profile.

[gcode_macro _QIDI_PRODUCTION_SETTINGS]
# QIDI HARDWARE ON MAINLINE: Storage for purge, wipe and adaptive-prime settings.
description: Storage for purge, wipe and adaptive-prime settings
# QIDI's proven stock amount is enough to clean the melt zone; the separate
# Voron prime then establishes flow at the object. This avoids wasting 120 mm
# of filament and roughly 24 seconds on every default print start.
variable_chute_purge_amount: 80.0
variable_chute_purge_chunk: 50.0
variable_cool_target: 140.0
variable_probe_maximum: 150.0
variable_smart_park_height: 10.0
variable_purge_height: 0.8
variable_purge_margin: 10.0
variable_voron_purge_amount: 30.0
variable_voron_flow_rate: 12.0
variable_verbose: True
gcode:
    { action_respond_info("This macro only stores Plus4 production settings") }

[gcode_macro _QIDI_MOVE_TO_CHUTE]
# QIDI HARDWARE ON MAINLINE: Enter the factory purge chute without crossing its actuator arm.
description: Enter the factory purge chute without crossing its actuator arm
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        { action_raise_error("_QIDI_MOVE_TO_CHUTE requires X and Y to be homed") }
    {% endif %}
    {% set position = printer.toolhead.position %}
    {% set x = position.x|float %}
    {% set y = position.y|float %}
    {% set at_chute = (x - 95.0)|abs < 0.05 and (y - 324.0)|abs < 0.05 %}
    # STOCK DEVIATION / CRASH FIX:
    # Use physical toolhead coordinates and relative moves so stale G92 or
    # restored G-code offsets cannot redirect this safety-critical route.
    # If already at the chute, do not leave and re-enter the service area.
    {% if not at_chute %}
        G91
        # At X<56 the head must first clear the left stepper. Otherwise pull Y
        # forward before changing X, avoiding the rear nozzle-cleaning pad.
        {% if x < 55.95 %}
            G1 X{56.0 - x} F12000
        {% endif %}
        {% if (y - 300.0)|abs >= 0.05 %}
            G1 Y{300.0 - y} F12000
        {% endif %}
        {% if x > 56.05 %}
            G1 X{56.0 - x} F12000
        {% endif %}
        # Enter the rear service area only through the known-safe corridor.
        G1 Y24 F600
        G1 X39 F600
    {% endif %}
    # Preserve the macro's existing contract: callers leave in absolute mode.
    G90
    M400

[gcode_macro PURGE_PARK]
# QIDI HARDWARE ON MAINLINE: Lift safely and park over the factory purge chute.
description: Lift safely and park over the factory purge chute
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("PURGE_PARK requires all axes to be homed") }
    {% endif %}
    {% set position = printer.toolhead.position %}
    {% set axis_maximum = printer.toolhead.axis_maximum %}
    {% set lift_target = [axis_maximum.z, [35.0, position.z + 5.0]|max]|min %}
    G90
    # Match QIDI1's 15 mm/s service-area lift rate.
    G1 Z{lift_target} F900
    _QIDI_MOVE_TO_CHUTE

[gcode_macro _QIDI_PURGE_INTO_CHUTE]
# QIDI HARDWARE ON MAINLINE: Purge filament into the factory chute in Klipper-safe chunks.
description: Purge filament into the factory chute in Klipper-safe chunks
gcode:
    {% set settings = printer["gcode_macro _QIDI_PRODUCTION_SETTINGS"] %}
    {% set amount = params.AMOUNT|default(settings.chute_purge_amount)|float %}
    {% set speed = params.SPEED|default(300)|float %}
    {% set chunk = settings.chute_purge_chunk|float %}
    {% set whole_chunks = (amount / chunk)|int %}
    {% set remainder = amount - (whole_chunks * chunk) %}
    {% if amount < 0 or amount > 500 %}
        { action_raise_error("Chute purge amount must be between 0 and 500 mm") }
    {% endif %}
    {% if speed <= 0 or speed > 1200 %}
        { action_raise_error("Chute purge speed must be above 0 and at most 1200 mm/min") }
    {% endif %}
    M83
    G92 E0
    G1 E5 F50
    {% for unused in range(whole_chunks) %}
        G1 E{chunk} F{speed}
    {% endfor %}
    {% if remainder > 0.001 %}
        G1 E{remainder} F{speed}
    {% endif %}
    G1 E-2 F1200
    G92 E0

[gcode_macro _QIDI_EJECT_PURGE]
# QIDI HARDWARE ON MAINLINE: Operate the factory purge ejector arm.
description: Operate the factory purge ejector arm
gcode:
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y308 F30000
    G1 Y324 F600

[gcode_macro FLUSH]
# QIDI HARDWARE ON MAINLINE: Park at the factory chute, operate its ejector, and exit safely.
description: Park at the factory chute, operate its ejector, and exit safely
gcode:
    {% if printer.print_stats.state|lower in ["printing", "paused"] %}
        { action_raise_error("FLUSH is unavailable while a print is active") }
    {% endif %}
    PURGE_PARK
    _QIDI_EJECT_PURGE
    G1 Y300 F9000
    M400
    { action_respond_info("Factory purge chute flushed") }

[gcode_macro _QIDI_PEI_WIPE]
# QIDI HARDWARE ON MAINLINE: Wipe the nozzle on the rear PEI cleaning area.
description: Wipe the nozzle on the rear PEI cleaning area
gcode:
    G1 X124 F1000
    G1 X133 F200
    G1 Y321 F200
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G2 I0.5 J0.5 F600
    G1 Y319 F150
    G1 X132
    G1 Y324
    G1 X131
    G1 Y319
    G1 X130
    G1 Y324
    G1 X129
    G1 Y319
    G1 X113 F200
    G1 Y320
    G1 X125
    G1 X113
    G1 X125
    G2 I0.5 J0.5 F200
    G2 I0.5 J0.5 F200
    G2 I0.5 J0.5 F200
    G1 Y320 F600
    G1 X95 F600
    M400

[gcode_macro _QIDI_BRUSH_WIPE]
# QIDI HARDWARE ON MAINLINE: Scrub the nozzle on the factory silicone brush.
description: Scrub the nozzle on the factory silicone brush
gcode:
    G1 Y300 F600
    G1 X95 F12000
    G1 Y314 F9000
    G1 Y324 F600
    {% for y in [324.0, 323.5, 323.0, 322.5, 322.0] %}
        G1 Y{y} F600
        G1 X58 F12000
        G1 X78 F12000
    {% endfor %}
    G1 X75 F12000
    G1 Y321.5 F600
    G2 I0.8 J0.8 F600
    G2 I0.8 J0.8 F600
    G2 I0.8 J0.8 F600
    G1 Y324 F600
    G1 X95 F12000
    G1 Y316 F9000
    G1 Y312 F600
    M400

[gcode_macro CLEAR_NOZZLE]
# QIDI HARDWARE ON MAINLINE: Purge, eject, wipe and cool the nozzle using factory hardware.
description: Purge, eject, wipe and cool the nozzle using factory hardware
gcode:
    {% set settings = printer["gcode_macro _QIDI_PRODUCTION_SETTINGS"] %}
    {% set hotend = params.HOTEND|default(250)|float %}
    {% set purge = params.PURGE|default(1)|int %}
    {% set purge_amount = params.PURGE_AMOUNT|default(settings.chute_purge_amount)|float %}
    {% set pei_wipe = params.PEI_WIPE|default(1)|int %}
    SAVE_GCODE_STATE NAME=QIDI_CLEAR_NOZZLE_STATE
    PURGE_PARK
    M107 P0
    M109 S{hotend}
    {% if purge == 1 %}
        _QIDI_PURGE_INTO_CHUTE AMOUNT={purge_amount}
    {% endif %}
    M106 P0 S255
    G4 P5000
    M104 S{settings.cool_target}
    _QIDI_EJECT_PURGE
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=170
    {% if pei_wipe == 1 %}
        _QIDI_PEI_WIPE
    {% endif %}
    _QIDI_BRUSH_WIPE
    G1 Y300 F12000
    G1 X10 F12000
    M106 P0 S255
    M104 S{settings.cool_target}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={settings.probe_maximum}
    M107 P0
    M400
    RESPOND MSG="Nozzle purged, wiped and cooled"
    RESTORE_GCODE_STATE NAME=QIDI_CLEAR_NOZZLE_STATE

[gcode_macro SMART_PARK]
# QIDI HARDWARE ON MAINLINE: Park near the first object while the hotend reaches print temperature.
description: Park near the first object while the hotend reaches print temperature
gcode:
    {% set settings = printer["gcode_macro _QIDI_PRODUCTION_SETTINGS"] %}
    {% set objects = printer.exclude_object.objects %}
    {% set height = settings.smart_park_height|float %}
    {% set margin = settings.purge_margin|float %}
    {% set travel_feed = printer.toolhead.max_velocity|float * 60.0 %}
    {% set z_feed = printer.configfile.settings.printer.max_z_velocity|float * 60.0 %}
    {% if objects|length > 0 %}
        {% set points = objects|map(attribute='polygon')|sum(start=[]) %}
        {% set park_x = [[points|map(attribute=0)|min - margin, 5.0]|max, 295.0]|min %}
        {% set park_y = [[points|map(attribute=1)|min - margin, 5.0]|max, 295.0]|min %}
    {% else %}
        {% set park_x = 10.0 %}
        {% set park_y = 10.0 %}
    {% endif %}
    {% if settings.verbose %}
        { action_respond_info("Smart Park: X%.1f Y%.1f" % (park_x, park_y)) }
    {% endif %}
    SAVE_GCODE_STATE NAME=QIDI_SMART_PARK_STATE
    G90
    {% if printer.toolhead.position.z < height %}
        G0 Z{height} F{z_feed}
    {% endif %}
    # Match QIDI1/KAMP by using the configured XY velocity ceiling.
    G0 X{park_x} Y{park_y} F{travel_feed}
    RESTORE_GCODE_STATE NAME=QIDI_SMART_PARK_STATE

[gcode_macro VORON_PURGE]
# QIDI HARDWARE ON MAINLINE: Draw an object-aware Voron-logo prime, with a safe fixed fallback.
description: Draw an object-aware Voron-logo prime, with a safe fixed fallback
gcode:
    {% set settings = printer["gcode_macro _QIDI_PRODUCTION_SETTINGS"] %}
    {% set objects = printer.exclude_object.objects %}
    {% set size = 10.0 %}
    {% set margin = settings.purge_margin|float %}
    {% set amount = settings.voron_purge_amount|float %}
    {% set height = settings.purge_height|float %}
    {% set speed = (settings.voron_flow_rate|float / 5.0) * 60.0 %}
    {% set travel_feed = printer.toolhead.max_velocity|float * 60.0 %}
    {% set z_feed = printer.configfile.settings.printer.max_z_velocity|float * 60.0 %}
    {% if objects|length > 0 %}
        {% set points = objects|map(attribute='polygon')|sum(start=[]) %}
        {% set object_min_x = points|map(attribute=0)|min %}
        {% set object_max_x = points|map(attribute=0)|max %}
        {% set object_min_y = points|map(attribute=1)|min %}
        {% set object_max_y = points|map(attribute=1)|max %}
        {% set bed_min = 5.0 %}
        {% set origin_max = 285.0 %}
        {% set left_x = object_min_x - margin - size %}
        {% set right_x = object_max_x + margin %}
        {% set below_y = object_min_y - margin - size %}
        {% set above_y = object_max_y + margin %}
        {% if left_x >= bed_min %}
            {% set origin_x = left_x %}
            {% set x_separated = true %}
        {% elif right_x <= origin_max %}
            {% set origin_x = right_x %}
            {% set x_separated = true %}
        {% else %}
            {% set origin_x = [[object_min_x, bed_min]|max, origin_max]|min %}
            {% set x_separated = false %}
        {% endif %}
        {% if below_y >= bed_min %}
            {% set origin_y = below_y %}
            {% set y_separated = true %}
        {% elif above_y <= origin_max %}
            {% set origin_y = above_y %}
            {% set y_separated = true %}
        {% else %}
            {% set origin_y = [[object_min_y, bed_min]|max, origin_max]|min %}
            {% set y_separated = false %}
        {% endif %}
        {% set purge_safe = x_separated or y_separated %}
    {% else %}
        {% set origin_x = 5.0 %}
        {% set origin_y = 5.0 %}
        {% set purge_safe = true %}
    {% endif %}
    {% if purge_safe %}
        {% if settings.verbose %}
            { action_respond_info("Voron purge: X%.1f Y%.1f, %.1f mm, %.1f mm clearance" % (origin_x, origin_y, amount, margin)) }
        {% endif %}
        SAVE_GCODE_STATE NAME=QIDI_VORON_PURGE_STATE
        G90
        M83
        G92 E0
        # Match QIDI1/KAMP by using the configured XY velocity ceiling.
        G0 X{origin_x} Y{origin_y + size / 2.0} F{travel_feed}
        G0 Z{height} F{z_feed}
        G1 X{origin_x + size * 0.289} Y{origin_y + size} E{amount / 4.0} F{speed}
        G1 E-0.5 F2100
        G0 Z{height * 2.0}
        G0 X{origin_x + size * 0.789} Y{origin_y + size}
        G0 Z{height}
        G1 E0.5 F2100
        G1 X{origin_x + size * 0.211} Y{origin_y} E{amount / 2.0} F{speed}
        G1 E-0.5 F2100
        G0 Z{height * 2.0}
        G0 X{origin_x + size * 0.711} Y{origin_y}
        G0 Z{height}
        G1 E0.5 F2100
        G1 X{origin_x + size} Y{origin_y + size / 2.0} E{amount / 4.0} F{speed}
        G1 E-0.5 F2100
        G92 E0
        G0 Z{height * 2.0} F{z_feed}
        RESTORE_GCODE_STATE NAME=QIDI_VORON_PURGE_STATE
    {% else %}
        { action_respond_info("Voron purge skipped: no brim-safe location outside the object bounds") }
    {% endif %}
